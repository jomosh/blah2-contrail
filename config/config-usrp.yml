capture:
  fs: 2000000
  fc: 204640000
  device:
    type: "Usrp"
    address: "localhost"
    subdev: "A:A A:B"
    antenna: ["RX2", "RX2"]
    gain: [20.0, 20.0]
    bandwidth: 2000000
  replay:
    state: false
    loop: true
    file: '/opt/blah2/replay/file.rspduo'

process:
  data:
    cpi: 0.5
    buffer: 1.5
    overlap: 0
  ambiguity:
    delayMin: -10
    delayMax: 400
    dopplerMin: -200
    dopplerMax: 200
  clutter:
    enable: true
    delayMin: -10
    delayMax: 400
    # Relative diagonal loading applied before Wiener-Hopf Cholesky.
    # Higher values improve numerical robustness but can slightly soften
    # clutter cancellation.
    diagonalLoadScale: 0.000001
  detection:
    enable: true
    pfa: 0.00001
    nGuard: 2
    nTrain: 6
    minDelay: 5
    minDoppler: 15
    cfarMode: "CAGO" # Available types: CA, CAGO
    postProcessMode: "cluster-centroid" # Available modes: local-peak, cluster-centroid
    nCentroid: 6
    exclusionZones:
      enabled: false
      zones:
        # Uncomment and adjust to suppress detections in specific regions.
        # delayMin/delayMax are in meters (bistatic range).
        # dopplerMin/dopplerMax are in Hz (bistatic Doppler).
        # - delayMin: 10000
        #   delayMax: 10100
        #   dopplerMin: -150
        #   dopplerMax: 150
  tracker:
    enable: true
    initiate:
      M: 3
      N: 5
      maxAcc: 10
    delete: 10
    smooth: "none"

network:
  ip: 0.0.0.0
  ports:
    # node1 suggestion
    api: 3000
    map: 3001
    detection: 3002
    track: 3003
    adsb: 3004
    timestamp: 4000
    timing: 4001
    iqdata: 4002
    config: 4003

    # node2 example port-offset (+100)
    # api: 3100
    # map: 3101
    # detection: 3102
    # track: 3103
    # adsb: 3104
    # timestamp: 4100
    # timing: 4101
    # iqdata: 4102
    # config: 4103

truth:
  adsb:
    enabled: false
    tar1090: 'adsb.30hours.dev'
    adsb2dd: 'adsb2dd.30hours.dev'
  ais:
    enabled: false
    ip: 0.0.0.0
    port: 30001

location:
  rx:
    latitude: -34.9286
    longitude: 138.5999
    altitude: 50
    name: "Adelaide"
  tx:
    latitude: -34.9810
    longitude: 138.7081
    altitude: 750
    name: "Mount Lofty"

save:
  iq: true
  map: false
  detection: false
  timing: false
  path: "/blah2/save/"
